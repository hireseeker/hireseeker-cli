name: CLI acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - run: npm run syntax
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node scripts/build-package.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: .artifacts/
          include-hidden-files: true
          retention-days: 30
  platform:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: .artifacts
      - run: npm run test:package
  deepseek:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: .artifacts
      - name: Установить зафиксированный Harness
        run: npm install --prefix .artifacts/harness-runtime --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2 pnpm@10.32.1
      - name: Проверить плагин без вызовов модели
        run: npm run test:deepseek
  acceptance:
    if: ${{ always() }}
    needs: [build, platform, deepseek]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Проверить все результаты
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          DEEPSEEK_RESULT: ${{ needs.deepseek.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$PLATFORM_RESULT" = success
          test "$DEEPSEEK_RESULT" = success
